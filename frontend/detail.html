<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title id="pageTitle">Loading... — BokepHunter</title>
  <meta name="description" id="pageMeta" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] } } }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #1a0010; }
    ::-webkit-scrollbar-thumb { background: #831843; border-radius: 3px; }
    .skeleton { background: linear-gradient(90deg, #3b001a 25%, #500127 50%, #3b001a 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    #playerFrame iframe { width: 100%; height: 100%; border: none; }
    #playerFrame video { width: 100%; height: 100%; background: #000; display: block; }
  </style>
</head>
<body class="bg-pink-950 text-pink-50 antialiased pb-16 sm:pb-0 min-h-screen">

<!-- Header -->
<header class="sticky top-0 z-50 border-b border-pink-800/50 bg-pink-950/90 backdrop-blur-2xl">
  <div class="mx-auto max-w-[1400px] px-3 sm:px-5 py-2 sm:py-3">
    <div class="flex items-center gap-3">
      <a href="/" class="flex items-center gap-2 shrink-0">
        <div class="h-7 w-7 rounded-lg bg-gradient-to-br from-pink-500 to-pink-700 flex items-center justify-center text-white font-black text-sm shadow-lg">B</div>
        <span class="font-extrabold text-base sm:text-lg text-white tracking-tight">BokepHunter</span>
      </a>
      <a href="/" class="ml-2 text-pink-400 hover:text-pink-200 text-sm flex items-center gap-1 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        <span class="hidden sm:inline">Kembali</span>
      </a>
      <div class="ml-auto flex items-center gap-2">
        <button id="searchToggle" class="flex items-center justify-center w-8 h-8 rounded-lg border border-pink-700/50 text-pink-300 hover:text-white hover:bg-pink-800/50">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </button>
      </div>
    </div>
    <div id="searchBar" class="hidden mt-2 pb-1">
      <form id="searchForm" class="flex gap-2">
        <input id="searchInput" type="text" placeholder="Cari video..." autocomplete="off"
          class="flex-1 rounded-xl bg-pink-900/60 border border-pink-700/50 px-4 py-2 text-sm text-pink-50 placeholder-pink-400/50 focus:outline-none focus:border-pink-500">
        <button type="submit" class="rounded-xl bg-pink-600 hover:bg-pink-500 px-4 py-2 text-sm font-semibold text-white transition-colors">Cari</button>
      </form>
    </div>
  </div>
</header>

<!-- Loading State -->
<div id="loadingState" class="mx-auto max-w-[1400px] px-3 sm:px-5 py-6">
  <div class="lg:grid lg:grid-cols-[1fr_320px] gap-6">
    <div>
      <div class="aspect-video rounded-2xl skeleton"></div>
      <div class="mt-4 space-y-3">
        <div class="h-6 skeleton rounded w-3/4"></div>
        <div class="h-4 skeleton rounded w-1/3"></div>
      </div>
    </div>
    <div class="hidden lg:block space-y-3 mt-0">
      <div class="h-5 skeleton rounded w-1/2"></div>
      <div class="flex gap-2"><div class="h-24 w-[168px] skeleton rounded-lg"></div><div class="flex-1 space-y-2"><div class="h-4 skeleton rounded"></div><div class="h-3 skeleton rounded w-2/3"></div></div></div>
      <div class="flex gap-2"><div class="h-24 w-[168px] skeleton rounded-lg"></div><div class="flex-1 space-y-2"><div class="h-4 skeleton rounded"></div><div class="h-3 skeleton rounded w-2/3"></div></div></div>
    </div>
  </div>
</div>

<!-- Video Content -->
<div id="videoContent" class="hidden mx-auto max-w-[1400px] px-3 sm:px-5 py-4 sm:py-6">
  <div class="lg:grid lg:grid-cols-[1fr_320px] xl:grid-cols-[1fr_360px] gap-6 items-start">

    <!-- Left: Player + Info -->
    <div>
      <!-- Player -->
      <div class="-mx-3 sm:mx-0 sm:rounded-2xl bg-black overflow-hidden sm:shadow-2xl sm:shadow-black/50 sm:ring-1 sm:ring-pink-800 relative">
        <div class="aspect-video relative">
          <!-- Overlay (click to play) -->
          <div id="playerOverlay" class="absolute inset-0 z-10 bg-black flex items-center justify-center cursor-pointer group">
            <img id="playerThumb" src="" alt="" class="absolute inset-0 w-full h-full object-cover opacity-50" referrerpolicy="no-referrer" onerror="this.style.display='none'">
            <div class="relative z-20 text-center">
              <div id="playBtn" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-pink-500/90 flex items-center justify-center mx-auto shadow-2xl shadow-pink-500/50 group-hover:scale-110 transition-transform">
                <svg class="w-8 h-8 sm:w-10 sm:h-10 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </div>
              <p class="mt-3 text-sm text-white/80 font-medium">Klik untuk Putar</p>
            </div>
          </div>
          <!-- Player Frame -->
          <div id="playerFrame" class="w-full h-full hidden absolute inset-0"></div>
          <!-- No Embed fallback -->
          <div id="noEmbed" class="hidden absolute inset-0 bg-pink-900/90 flex items-center justify-center text-center p-6">
            <div>
              <div class="text-5xl mb-3">🔒</div>
              <p class="text-pink-200 font-semibold">Video tidak tersedia untuk embed langsung</p>
              <a id="watchExternalLink" href="#" target="_blank" rel="noopener noreferrer"
                class="inline-block mt-4 rounded-xl bg-pink-600 hover:bg-pink-500 px-6 py-2.5 text-sm font-bold text-white transition-colors">
                ▶ Tonton di Sumber Asli
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Video Info -->
      <div class="mt-3 sm:mt-5 px-0">
        <h1 id="videoTitle" class="text-base sm:text-xl font-bold text-white leading-snug"></h1>
        <div class="mt-2 flex flex-wrap items-center gap-2 sm:gap-3 text-xs sm:text-sm text-pink-300/70">
          <span id="videoViews" class="flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            <span></span>
          </span>
          <span id="videoLikes" class="hidden flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span></span>
          </span>
          <span id="videoTime" class="flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span></span>
          </span>
          <span id="videoPosted" class="hidden flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span></span>
          </span>
        </div>
        <!-- Categories -->
        <div id="videoCategories" class="mt-3 flex flex-wrap gap-1.5"></div>
        <!-- Description -->
        <div id="videoDesc" class="mt-3 text-xs sm:text-sm text-pink-200/60 leading-relaxed bg-pink-900/30 rounded-xl p-3 hidden"></div>
      </div>

      <!-- Mobile Related -->
      <div class="lg:hidden mt-5">
        <h2 class="text-sm font-bold text-white mb-3">Video Lainnya</h2>
        <div id="mobileRelated" class="grid grid-cols-2 gap-2 sm:gap-3"></div>
      </div>
    </div>

    <!-- Right: Related Videos -->
    <div class="hidden lg:block">
      <h2 class="text-sm font-bold text-white mb-3">Video Lainnya</h2>
      <div id="relatedList" class="space-y-2"></div>
    </div>
  </div>
</div>

<!-- Error State -->
<div id="errorState" class="hidden mx-auto max-w-[1400px] px-3 sm:px-5 py-20 text-center">
  <div class="text-5xl mb-4">⚠️</div>
  <p class="text-pink-300 font-semibold text-lg">Gagal memuat video</p>
  <p id="errorMsg" class="text-pink-400/60 text-sm mt-1"></p>
  <a href="/" class="inline-block mt-4 rounded-xl bg-pink-600 hover:bg-pink-500 px-6 py-2 text-sm font-semibold text-white transition-colors">Kembali ke Home</a>
</div>

<!-- Mobile Bottom Nav -->
<nav class="sm:hidden fixed bottom-0 inset-x-0 z-50 bg-pink-950/95 backdrop-blur-2xl border-t border-pink-800/50 flex items-center justify-around py-2">
  <a href="/" class="flex flex-col items-center gap-0.5 px-3 py-1 text-pink-200">
    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span class="text-[10px] font-semibold">Home</span>
  </a>
  <a href="/?cat=bokep-indo" class="flex flex-col items-center gap-0.5 px-3 py-1 text-pink-400/60 hover:text-pink-200 transition-colors">
    <span class="text-lg leading-none">🇮🇩</span>
    <span class="text-[10px] font-semibold">Indo</span>
  </a>
  <a href="/?cat=bokep-jepang" class="flex flex-col items-center gap-0.5 px-3 py-1 text-pink-400/60 hover:text-pink-200 transition-colors">
    <span class="text-lg leading-none">🇯🇵</span>
    <span class="text-[10px] font-semibold">Jepang</span>
  </a>
  <a href="/?cat=bokep-colmek" class="flex flex-col items-center gap-0.5 px-3 py-1 text-pink-400/60 hover:text-pink-200 transition-colors">
    <span class="text-lg leading-none">💦</span>
    <span class="text-[10px] font-semibold">Colmek</span>
  </a>
</nav>

<script type="module" src="/js/detail.js"></script>
</body>
</html>
