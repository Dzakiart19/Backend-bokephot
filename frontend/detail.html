<!-- History guard: back button tetap di dalam website -->
<script>
    (function () {
        // Push 2 entry ekstra saat load agar back button butuh beberapa kali tekan untuk keluar
        history.pushState(null, '', window.location.href);
        history.pushState(null, '', window.location.href);

        // Override location.replace → pakai location.href (BUKAN _origReplace)
        // Kenapa: location.replace() MENGGANTIKAN entry history saat ini, sehingga
        // entry website ikut hilang dan back button melewati website langsung ke halaman sebelumnya.
        // location.href MENAMBAH entry baru ke history → back dari halaman iklan kembali ke website.
        window.location.replace = function (url) {
            window.location.href = url;
        };

        // Saat back ditekan dan masih di halaman yang sama, push ulang agar tidak keluar
        window.addEventListener('popstate', function () {
            if (window.location.href.indexOf(window.location.hostname) !== -1) {
                history.pushState(null, '', window.location.href);
            }
        });
    })();
</script>
