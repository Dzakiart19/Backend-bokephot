<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Kampung Bokep — Video 18+ HD Terbaru</title>
  <meta name="description" content="Nonton video bokep terbaru, viral, dan terlengkap di Kampung Bokep.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] } } }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .thumb-img { transition: transform 0.35s ease; }
    .hover-card:hover .thumb-img { transform: scale(1.06); }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #1a0010; }
    ::-webkit-scrollbar-thumb { background: #831843; border-radius: 3px; }
    .skeleton { background: linear-gradient(90deg, #3b001a 25%, #500127 50%, #3b001a 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-pink-950 text-pink-50 antialiased pb-14 sm:pb-0 min-h-screen">

<!-- Header -->
<header class="sticky top-0 z-50 border-b border-pink-800/50 bg-pink-950/90 backdrop-blur-2xl">
  <div class="mx-auto max-w-[1400px] px-3 sm:px-5 py-2 sm:py-3">
    <div class="flex items-center gap-2 sm:gap-3">

      <!-- Mobile: hamburger -->
      <button id="menuToggle" class="sm:hidden flex items-center justify-center w-8 h-8 rounded-lg border border-pink-700/50 text-pink-300 hover:text-white hover:bg-pink-800/50 shrink-0">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M3 6.75A.75.75 0 013.75 6h16.5a.75.75 0 010 1.5H3.75A.75.75 0 013 6.75zM3 12a.75.75 0 01.75-.75h16.5a.75.75 0 010 1.5H3.75A.75.75 0 013 12zm0 5.25a.75.75 0 01.75-.75h16.5a.75.75 0 010 1.5H3.75a.75.75 0 01-.75-.75z" clip-rule="evenodd"/></svg>
      </button>

      <!-- Logo -->
      <a href="/" class="flex items-center gap-2 shrink-0">
        <div class="h-7 w-7 rounded-lg bg-gradient-to-br from-pink-500 to-pink-700 flex items-center justify-center text-white font-black text-[11px] tracking-tight shadow-lg">KB</div>
        <span class="font-extrabold text-base sm:text-lg text-white tracking-tight">Kampung Bokep</span>
      </a>

      <!-- Desktop Nav (diisi JS) -->
      <nav class="hidden sm:flex items-center gap-1 overflow-x-auto scrollbar-hide flex-1" id="desktopNav">
        <a href="/" id="homeLink"
          class="shrink-0 flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold transition-all border border-pink-500/50 bg-pink-800/60 text-white">
          <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z"/><path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z"/></svg>
          <span>Home</span>
        </a>
        <!-- kategori featured dirender JS -->
      </nav>

      <!-- Search toggle -->
      <div class="ml-auto sm:ml-0 shrink-0">
        <button id="searchToggle" class="flex items-center justify-center w-8 h-8 rounded-lg border border-pink-700/50 text-pink-300 hover:text-white hover:bg-pink-800/50">
          <svg id="searchIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M10.5 3.75a6.75 6.75 0 100 13.5 6.75 6.75 0 000-13.5zM2.25 10.5a8.25 8.25 0 1114.59 5.28l4.69 4.69a.75.75 0 11-1.06 1.06l-4.69-4.69A8.25 8.25 0 012.25 10.5z" clip-rule="evenodd"/></svg>

      </div>
    </div>

    <!-- Search bar -->
    <div id="searchBar" class="hidden mt-2 pb-1">
      <form id="searchForm" class="flex gap-2">
        <input id="searchInput" type="text" placeholder="Cari video..." autocomplete="off"
          class="flex-1 rounded-xl bg-pink-900/60 border border-pink-700/50 px-4 py-2 text-sm text-pink-50 placeholder-pink-400/50 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500/50">
        <button type="submit" class="rounded-xl bg-pink-600 hover:bg-pink-500 px-4 py-2 text-sm font-semibold text-white transition-colors">Cari</button>
      </form>
    </div>
  </div>
</header>

<!-- Mobile Sidebar -->
<div id="mobileOverlay" class="fixed inset-0 z-[60] bg-black/60 hidden sm:hidden" onclick="closeSidebar()"></div>
<div id="mobileSidebar" class="fixed inset-y-0 left-0 z-[70] w-72 bg-pink-950 border-r border-pink-800/50 shadow-2xl transform -translate-x-full transition-transform duration-250 sm:hidden overflow-y-auto">
  <div class="flex items-center justify-between p-4 border-b border-pink-800/50">
    <span class="font-extrabold text-white text-sm">Semua Kategori</span>
    <button onclick="closeSidebar()" class="w-7 h-7 flex items-center justify-center text-pink-400 hover:text-white rounded-lg hover:bg-pink-800/40 transition-colors">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z" clip-rule="evenodd"/></svg>
    </button>
  </div>
  <div class="p-3 space-y-0.5" id="sidebarNav">
    <a href="/" class="flex items-center gap-3 rounded-xl px-4 py-2.5 text-sm font-semibold text-pink-200 hover:bg-pink-800/40 transition-colors">
      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z"/><path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z"/></svg>

<!-- Main -->
<main class="mx-auto max-w-[1400px] px-3 sm:px-5 py-4 sm:py-6">

  <!-- Page header -->
  <div class="flex items-center justify-between gap-3 mb-3 sm:mb-4 flex-wrap">
    <h1 id="pageTitle" class="text-lg sm:text-2xl font-bold text-white tracking-tight">Video Terbaru</h1>
    <div id="filterButtons" class="flex gap-1 sm:gap-1.5 flex-wrap">
      <button data-filter="terbaru" class="filter-btn active flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold transition-all bg-pink-600 text-white border border-pink-500">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M9 4.5a.75.75 0 01.721.544l.813 2.846a3.75 3.75 0 002.576 2.576l2.846.813a.75.75 0 010 1.442l-2.846.813a3.75 3.75 0 00-2.576 2.576l-.813 2.846a.75.75 0 01-1.442 0l-.813-2.846a3.75 3.75 0 00-2.576-2.576l-2.846-.813a.75.75 0 010-1.442l2.846-.813A3.75 3.75 0 007.466 7.89l.813-2.846A.75.75 0 019 4.5zM18 1.5a.75.75 0 01.728.568l.258 1.036c.236.94.97 1.674 1.91 1.91l1.036.258a.75.75 0 010 1.456l-1.036.258c-.94.236-1.674.97-1.91 1.91l-.258 1.036a.75.75 0 01-1.456 0l-.258-1.036a2.625 2.625 0 00-1.91-1.91l-1.036-.258a.75.75 0 010-1.456l1.036-.258a2.625 2.625 0 001.91-1.91l.258-1.036A.75.75 0 0118 1.5z" clip-rule="evenodd"/></svg>
        Terbaru

    </div>
  </div>

  <!-- Video Grid -->
  <div id="videoGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2 sm:gap-3 md:gap-4"></div>

  <!-- Skeleton -->
  <div id="skeletonGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2 sm:gap-3 md:gap-4">
    <div class="space-y-2" id="skeletonTemplate">
      <div class="aspect-video rounded-xl skeleton"></div>
      <div class="h-3 rounded skeleton w-full"></div>
      <div class="h-3 rounded skeleton w-2/3"></div>
    </div>
  </div>

  <!-- Empty State -->
  <div id="emptyState" class="hidden text-center py-20">
    <div class="mx-auto w-12 h-12 text-pink-800 mb-4">
      <svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M1.5 5.625c0-1.036.84-1.875 1.875-1.875h17.25c1.035 0 1.875.84 1.875 1.875v12.75c0 1.035-.84 1.875-1.875 1.875H3.375A1.875 1.875 0 011.5 18.375V5.625zm1.5 0v1.5c0 .207.168.375.375.375h1.5a.375.375 0 00.375-.375v-1.5a.375.375 0 00-.375-.375h-1.5A.375.375 0 003 5.625zm16.125-.375a.375.375 0 00-.375.375v1.5c0 .207.168.375.375.375h1.5A.375.375 0 0021 7.125v-1.5a.375.375 0 00-.375-.375h-1.5zM21 9.375A.375.375 0 0020.625 9h-1.5a.375.375 0 00-.375.375v1.5c0 .207.168.375.375.375h1.5a.375.375 0 00.375-.375v-1.5zm0 3.75a.375.375 0 00-.375-.375h-1.5a.375.375 0 00-.375.375v1.5c0 .207.168.375.375.375h1.5a.375.75 0 00.375-.375v-1.5zm0 3.75a.375.375 0 00-.375-.375h-1.5a.375.375 0 00-.375.375v1.5c0 .207.168.375.375.375h1.5a.375.375 0 00.375-.375v-1.5zM4.875 18.75a.375.375 0 00.375-.375v-1.5a.375.375 0 00-.375-.375h-1.5a.375.375 0 00-.375.375v1.5c0 .207.168.375.375.375h1.5zM3.375 15h1.5a.375.375 0 00.375-.375v-1.5a.375.375 0 00-.375-.375h-1.5a.375.375 0 00-.375.375v1.5c0 .207.168.375.375.375zm0-3.75h1.5a.375.375 0 00.375-.375v-1.5A.375.375 0 004.875 9h-1.5A.375.375 0 003 9.375v1.5c0 .207.168.375.375.375zm4.125 0a.75.75 0 000 1.5h9a.75.75 0 000-1.5h-9z" clip-rule="evenodd"/></svg>

    <p class="text-pink-400/60 text-sm mt-1">Coba kata kunci lain atau kategori lain</p>
  </div>

  <!-- Error State -->
  <div id="errorState" class="hidden text-center py-20">
    <div class="mx-auto w-12 h-12 text-pink-700 mb-4">
      <svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd"/></svg>

    <p class="text-pink-300 font-semibold text-lg">Gagal memuat video</p>
    <p id="errorMsg" class="text-pink-400/60 text-sm mt-1"></p>
    <button onclick="loadVideos()" class="mt-4 rounded-xl bg-pink-600 hover:bg-pink-500 px-6 py-2 text-sm font-semibold text-white transition-colors">Coba Lagi</button>
  </div>

  <!-- Pagination -->
  <div id="pagination" class="hidden mt-8 flex flex-col items-center gap-3">
    <div id="pageInfo" class="text-xs text-pink-500/50"></div>
    <div id="pageButtons" class="flex items-center gap-1.5 flex-wrap justify-center"></div>
  </div>
</main>

<!-- Mobile Bottom Nav — Home only -->
<nav class="sm:hidden fixed bottom-0 inset-x-0 z-50 bg-pink-950/95 backdrop-blur-2xl border-t border-pink-800/50 flex items-center justify-center py-2">
  <a href="/" class="flex flex-col items-center gap-0.5 px-6 py-1 text-pink-200 transition-colors" id="mobileHomeLink">
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z"/><path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z"/></svg>
